# AUGECOIN Wallet Web — nginx reverse proxy (produção: wallet.augeco.in)
#
# BUG CORRIGIDO (HTTP 405 ao registrar / em todo POST /api/*):
#   Antes não havia `location /api/`, então /api/* caía no `location /` (SPA
#   estático, só GET). GET /api/* devolvia index.html e POST/OPTIONS -> 405.
#   O backend wallet-web (apps/wallet-web/server, src/index.js, porta 8787) está
#   correto. O `location /api/` abaixo resolve o problema.
#
# Aplicado em /etc/nginx/sites-available/wallet.augeco.in (recarregar com
# `sudo nginx -t && sudo systemctl reload nginx`).
#
# Guarda de regressão no CI: .github/workflows/ci.yml (job wallet-web) valida
# que GET /api/me é JSON e que POST /api/auth/register NÃO retorna 405/404.

server {
    listen 80;
    listen [::]:80;
    server_name wallet.augeco.in;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wallet.augeco.in;

    ssl_certificate     /etc/letsencrypt/live/explorer.augeco.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explorer.augeco.in/privkey.pem;

    root /opt/augecoin/wallet;
    index index.html;

    # Node RPC (augecoin-node) — proxy JSON-RPC.
    location /rpc {
        proxy_pass https://127.0.0.1:9005/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API da plataforma (wallet-web) — DEVE vir antes do fallback da SPA.
    # Prefixo /api/ é mais específico que /, então vence para todo /api/*.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/wallet.access.log;
    error_log  /var/log/nginx/wallet.error.log;
}
