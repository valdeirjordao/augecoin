# AUGECOIN — token.augeco.in (ferramenta de Smart Contracts / AUGE20)
#
# Subdomínio dedicado à gestão de contratos (Deploy AUGE20, Mint, Transfer,
# Explorer). O app servido é o build de apps/wallet-web/web (React) — ele já
# inclui a seção SmartContracts. É uma ferramenta de OPERADOR: o usuário informa
# o endpoint RPC (https://token.augeco.in/rpc) + a node admin API key.
#
# Estado: o bloco :80 está ativo em /etc/nginx/sites-available/token.augeco.in.
# O bloco :443 abaixo deve ser ativado APÓS emitir o certificado:
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d token.augeco.in
# (requer DNS A token.augeco.in -> IP deste servidor e porta 80 liberada)
# Depois: trocar o :80 para redirect 301 e descomentar o :443.

server {
    listen 80;
    listen [::]:80;
    server_name token.augeco.in;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # Após o cert: redireciona tudo para HTTPS.
    # return 301 https://$host$request_uri;

    # Temporário (antes do cert): serve o SPA em HTTP.
    root /opt/augecoin/apps/wallet-web/web/dist;
    index index.html;

    location /rpc {
        proxy_pass https://127.0.0.1:9005/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

