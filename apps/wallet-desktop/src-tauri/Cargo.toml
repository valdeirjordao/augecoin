[package]
name = "augecoin-wallet-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "augecoin_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
augecoin-crypto = { path = "../../../crates/augecoin-crypto" }
bip39 = "2"
rand = "0.8"
hex = "0.4"
keyring = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
