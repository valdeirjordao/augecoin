[package]
name = "augecoin-validator-desktop"
version = "0.1.0"
edition = "2021"
description = "AUGECOIN Validator Desktop — ativação, sincronização, heartbeat e dashboard do validador."

[lib]
name = "augecoin_validator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
augecoin-crypto = { path = "../../../crates/augecoin-crypto" }
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"
rand = "0.8"
dirs = "6"
ed25519-dalek = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "fs"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
