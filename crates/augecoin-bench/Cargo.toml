[package]
name = "augecoin-bench"
version = "0.1.0"
edition = "2021"
description = "AUGECOIN benchmark harness (Caliper-inspired) driving official JSON-RPC endpoints"
license = "MIT"

[dependencies]
augecoin-core = { path = "../augecoin-core" }
augecoin-crypto = { path = "../augecoin-crypto" }
augecoin-rpc = { path = "../augecoin-rpc" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
csv = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
