[package]
name = "augecoin-rpc"
version = "0.1.0"
edition = "2021"

[dependencies]
augecoin-consensus = { path = "../augecoin-consensus" }
augecoin-core = { path = "../augecoin-core" }
augecoin-crypto = { path = "../augecoin-crypto" }
augecoin-storage = { path = "../augecoin-storage" }
augecoin-contracts = { path = "../augecoin-contracts" }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
crossbeam-channel = "0.5"
dashmap = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
prometheus = { version = "0.13", default-features = false }
lru = "0.12"
rcgen = { version = "0.14", features = ["pem"] }
rustls = { version = "0.23", features = ["std", "ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full" ] }
tracing = "0.1"

[dev-dependencies]
wat = "1"
