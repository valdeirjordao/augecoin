name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop-linux:
    name: Release Packages (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libssl-dev clang librocksdb-dev

      - name: Build validator-desktop (.deb / .AppImage)
        env:
          AUGECOIN_RELEASE_PUBLIC_KEY_HEX: ${{ secrets.AUGECOIN_RELEASE_PUBLIC_KEY_HEX || '' }}
        run: |
          cargo build -p augecoin-node --release
          mkdir -p apps/validator-desktop/src-tauri/binaries
          cp target/release/augecoin-node \
            apps/validator-desktop/src-tauri/binaries/augecoin-node-x86_64-unknown-linux-gnu
          cd apps/validator-desktop
          npm ci
          npm run tauri build -- --bundles deb,appimage

      - name: Collect validator bundles
        run: |
          mkdir -p dist/linux
          cp target/release/bundle/deb/*.deb dist/linux/
          cp target/release/bundle/appimage/*.AppImage dist/linux/
          rm -rf target/release/bundle

      - name: Build wallet-desktop (.deb / .AppImage)
        run: |
          cd apps/wallet-desktop
          npm ci
          npm run tauri build -- --bundles deb,appimage

      - name: Collect wallet bundles
        run: |
          cp target/release/bundle/deb/*.deb dist/linux/
          cp target/release/bundle/appimage/*.AppImage dist/linux/

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/linux/*

  desktop-windows:
    name: Release Packages (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        run: rustup show

      - name: Add MSVC target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build validator-desktop (.msi / .nsis)
        shell: bash
        env:
          AUGECOIN_RELEASE_PUBLIC_KEY_HEX: ${{ secrets.AUGECOIN_RELEASE_PUBLIC_KEY_HEX || '' }}
        run: |
          cargo build -p augecoin-node --release --target x86_64-pc-windows-msvc
          mkdir -p apps/validator-desktop/src-tauri/binaries
          cp target/x86_64-pc-windows-msvc/release/augecoin-node.exe \
            apps/validator-desktop/src-tauri/binaries/augecoin-node-x86_64-pc-windows-msvc.exe
          cd apps/validator-desktop
          npm ci
          npm run tauri build -- --bundles msi,nsis

      - name: Collect validator bundles
        shell: bash
        run: |
          mkdir -p dist/windows
          cp target/release/bundle/msi/*.msi dist/windows/
          cp target/release/bundle/nsis/*.exe dist/windows/
          rm -rf target/release/bundle

      - name: Build wallet-desktop (.msi / .nsis)
        shell: bash
        run: |
          cd apps/wallet-desktop
          npm ci
          npm run tauri build -- --bundles msi,nsis

      - name: Collect wallet bundles
        shell: bash
        run: |
          cp target/release/bundle/msi/*.msi dist/windows/
          cp target/release/bundle/nsis/*.exe dist/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/windows/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [desktop-linux, desktop-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: List assets
        run: ls -la dist/

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets to existing release"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Augecoin $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
